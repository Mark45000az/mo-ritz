    <!-- Google Fonts: Sarabun (Thai) + Inter (EN) -->

      rel="stylesheet"
    />

    <!-- Eradicate Netlify badge / drawer overlays safely -->
    <style>
      #netlify-badge,
      .netlify-badge,
      [data-netlify-badge],
      [data-netlify-drawer],
      netlify-drawer,
      div[class*="netlify"],
      div[id*="netlify"],
      iframe[src*="netlify"],
      a[href*="netlify.com"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: fixed !important;
        top: -99999px !important;
        left: -99999px !important;
        width: 0 !important;
        height: 0 !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      (function() {
        function hideNetlifyBadge() {
          try {
            var outside = document.querySelectorAll('body > :not(#root)');
            for (var i = 0; i < outside.length; i++) {
              var el = outside[i];
              var text = el.textContent || '';
              var href = el.href || '';
              if (
                href.indexOf('netlify.com') !== -1 ||
                text.indexOf('Powered by Netlify') !== -1 ||
                (el.id && el.id.indexOf('netlify') !== -1)
              ) {
                el.style.setProperty('display', 'none', 'important');
                el.style.setProperty('visibility', 'hidden', 'important');
                el.style.setProperty('pointer-events', 'none', 'important');
              }
            }
          } catch (e) {}
        }
        setInterval(hideNetlifyBadge, 500);
        window.addEventListener('DOMContentLoaded', hideNetlifyBadge);
        window.addEventListener('load', hideNetlifyBadge);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
